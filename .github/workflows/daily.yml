name: Hourly News Bot

on:
  schedule:
    - cron: "0 0,3,6,9 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/run.js
      
      - name: Commit and push
        id: commit
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily/
          git commit -m "chore: news digest" || echo "No changes"
          git push

      - name: Push to WeCom
        env:
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: |
          LATEST_FILE=$(ls -t daily/*.md | head -n 1)
          
          if [ ! -f "$LATEST_FILE" ]; then
            echo "No file found"
            exit 0
          fi
          
          head -c 3000 "$LATEST_FILE" > /tmp/push_content.txt
          
          REPO_URL="https://github.com/${{ github.repository }}"
          FILE_PATH=$(basename "$LATEST_FILE")
          echo "" >> /tmp/push_content.txt
          echo "---" >> /tmp/push_content.txt
          echo "🔗 [查看完整日报](${REPO_URL}/blob/main/daily/${FILE_PATH})" >> /tmp/push_content.txt
          
          jq -n --rawfile content /tmp/push_content.txt '{msgtype: "markdown", markdown: {content: $content}}' > /tmp/push.json
          
          curl -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${WECOM_WEBHOOK_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/push.json
