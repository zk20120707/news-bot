name: Hourly News Bot

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/run.js
      - name: Commit and push
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add daily/
          git commit -m "chore: hourly digest" || echo "No changes"
          git push
